server.port=${PORT:8085}

# Database Connection (Supports Cloud Environment Variables with H2 fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:quizvault_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# JWT Security Key
jwt.secret=${JWT_SECRET:QuizVaultSuperSecretSigningKeyThatIsAtLeast32BytesLongForHS256Security!}
jwt.expirationMs=86400000

